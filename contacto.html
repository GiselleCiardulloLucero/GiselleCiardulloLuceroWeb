<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Giselle Ciardullo Lucero</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input, textarea { padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 0.8rem; background: #1a1714; color: white; border: none; cursor: pointer; font-size: 1rem; }
        button:hover { background: #c0392b; }
        .back-home {
  display: inline-block;
  margin-top: 1rem;
  padding: 0.8rem 1.2rem;
  background: transparent;
  color: #1a1714;
  border: 1px solid #1a1714;
  text-decoration: none;
  font-size: 1rem;
  text-align: center;
  transition: background 0.2s, color 0.2s;
}
.back-home:hover {
  background: #1a1714;
  color: #ffffff;
}
    </style>
</head>
<body>
    <h1>Contacto</h1>
    <p>¿Tienes alguna pregunta o propuesta? Escríbeme y te responderé lo antes posible.</p>

    <form action="https://formsubmit.co/ajax/giselleamarilla@gmail.com" method="POST">
        <input type="text" name="name" placeholder="Tu nombre" required>
        <input type="email" name="email" placeholder="Tu correo electrónico" required>
        <textarea name="message" rows="5" placeholder="Tu mensaje" required></textarea>
        
        <!-- Campos ocultos para personalizar FormSubmit -->
        <input type="hidden" name="_subject" value="Nuevo mensaje desde la web">
        <input type="hidden" name="_captcha" value="false">
        
        <button type="submit">Enviar mensaje</button>
    </form>
    <a href="index.html" class="back-home">← Volver al inicio</a>

    <script>
        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            try {
                const response = await fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
                if (response.ok) {
                    alert('¡Gracias! Tu mensaje ha sido enviado.');
                    form.reset();
                } else {
                    alert('Ha ocurrido un error. Inténtalo de nuevo más tarde.');
                }
            } catch (error) {
                alert('Error de red. Revisa tu conexión e inténtalo de nuevo.');
            }
        });
    </script>
</body>
</html>
