<body>
    <h1>Contacto</h1>
    <p>¿Tienes alguna pregunta o propuesta? Escríbeme y te responderé lo antes posible.</p>

    <form action="https://formsubmit.co/ajax/giselleamarilla@gmail.com" method="POST">
        <label for="name">Tu nombre</label>
        <input id="name" type="text" name="name" autocomplete="name" required>
        <label for="email">Tu correo electrónico</label>
        <input id="email" type="email" name="email" autocomplete="email" required>
        <label for="message">Tu mensaje</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        
        <!-- Campos ocultos para personalizar FormSubmit -->
        <input type="hidden" name="_subject" value="Nuevo mensaje desde la web">
        <input type="hidden" name="_captcha" value="false">
        
        <button type="submit">Enviar mensaje</button>

    </form>
