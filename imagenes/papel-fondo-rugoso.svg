<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="paper-relief" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.12 0.24" numOctaves="4" seed="18" stitchTiles="stitch"/>
    <feDiffuseLighting surfaceScale="3" diffuseConstant="1" lighting-color="#ffffff">
      <feDistantLight azimuth="45" elevation="55"/>
    </feDiffuseLighting>
  </filter>
  <rect width="320" height="320" filter="url(#paper-relief)" opacity="0.32"/>
</svg>
