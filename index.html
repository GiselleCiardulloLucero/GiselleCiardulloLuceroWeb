<script>
  // ===== VÍDEO EMERGENTE EN "PROYECTO" =====
  const VIDEO_ID = '1seDTiGlVqs';

  const titleWrap = document.querySelector('.proyecto-title-wrap');
  const videoBox = document.getElementById('proyectoVideo');
  let videoLoaded = false;

  if (titleWrap && videoBox) {
    titleWrap.addEventListener('mouseenter', () => {
      if (!videoLoaded) {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?autoplay=1&mute=1&rel=0`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.setAttribute('title', 'YouTube video player');
        iframe.setAttribute('frameborder', '0');
        videoBox.appendChild(iframe);
        videoLoaded = true;
      }
    });
  }
</script>
